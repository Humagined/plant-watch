name: Release
# Builds plant-watch.zip and attaches it to the GitHub Release, so
# releases/latest/download/plant-watch.zip always serves the newest version.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: The release tag matches the plugin version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c "import json, os, sys; v = json.load(open('plugin/.claude-plugin/plugin.json'))['version']; sys.exit(os.environ['TAG'] != 'v' + v and f'tag {os.environ[\"TAG\"]} is not v{v}')"
      - run: python build/package.py
      - name: Attach to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/plant-watch.zip
